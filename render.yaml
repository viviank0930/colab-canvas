services:
  - type: web
    name: colab-ai-workspace-vivian
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: DAILY_AI_LIMIT
        value: "10"
      - key: PER_USER_DAILY_LIMIT
        value: "3"
